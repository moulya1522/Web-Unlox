<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: 0;
        }
        .product{
            border: 1px solid black;
            border-radius: 25px;
            box-sizing: border-box;
            
            padding: 10px;
            text-align: center;
            margin: 10px;

            background-color: burlywood;

            box-shadow: 4px 4px 6px  black;
            /* x-aixs , y-axis , spread radius, colour*/
       }

        div img {
            border-radius: 25px;
            width: 100%;
            height: 150px;
            object-fit: cover;
            border: 1px solid black;
            margin-bottom: 10px;
        }

        div h2{
            font-family: Arial, Helvetica, sans-serif;
            color: brown;
            text-decoration: underline;
            margin-bottom: 10px;
        }

        div p{
            font-size: 20px;
            font-family: 'Times New Roman', Times, serif;
            margin-bottom: 10px;
        }

        .discount{
            color: blue;
            font-size: 20px;
        }

         div button{
            background-color: green;
            border: none;
            padding: 5px;
            border-radius: 20px;
        }

        .logo{
            size: 10px;
        }

        .ecom{
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px,1fr))
            
        
        }

       

    </style>
</head>
<body>

    <div class="ecom">
    
     <div class="product">
        <img src="https://images.pexels.com/photos/10997623/pexels-photo-10997623.jpeg" alt="Earphones">
        <h2>Earphones</h2>
        <p> Rs 1,200</p>
        
        <button>BUY NOW  </button>
     </div>

     <div class="product">
        <img src="https://images.pexels.com/photos/1591/technology-music-sound-things.jpg" alt="Headphones" >
        <h2>Headphones</h2>
        <p>Rs 5,000</p>
        <button>BUY NOW </button>
        
     </div>

     <div class="product">
        <img src="https://images.pexels.com/photos/8457654/pexels-photo-8457654.jpeg" alt="Earbuds" >
        <h2>Earbuds</h2>
        <p>Rs 2,000</p>
        <button>BUY NOW</button>

     </div>

     <div class="product">
        <img src="https://images.pexels.com/photos/6611936/pexels-photo-6611936.jpeg" alt="laptop">
        <h2>Laptop</h2>
        <p>Rs 3,00,000</p>
        <button>BUY NOW</button>
     </div>

     <div class="product">
        <img src="https://images.pexels.com/photos/18533790/pexels-photo-18533790.jpeg" alt="mobile">
        <h2>Mobile</h2>
        <p>Rs 1,50,000</p>
        <button>BUY NOW</button>
     </div>


     <div class="product">
        <img src="https://images.pexels.com/photos/25809273/pexels-photo-25809273.jpeg" alt="Tablet">
        <h2>Tablet</h2>
        <p>Rs 50,000</p>
        <button>BUY NOW</button>
     </div>

    </div>


</body>
</html>
