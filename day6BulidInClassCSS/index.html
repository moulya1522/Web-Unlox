<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
         #h{
             background-color: red; height: 60px; width: 60px;
         }

         #he{
            background-color: pink; height: 60px; width: 60px;
         }
         #he:hover{
            background-color: blue;
            transition: 5s;
         }

          #hel{
            background-color: hsl(246, 93%, 49%); height: 60px; width: 60px;
         }
         #hel:hover{
            background-color: #08f604;
            transition: 5s;
             transform: translateX(200px);
         }

          #hi{
            background-color: hsl(246, 93%, 49%); height: 60px; width: 60px;
         }
         #hi:hover{
            background-color: #08f604;
            transition: 5s;
            transform: translateY(200px);
         }

         #m{
            background-color: black; height: 80px; width: 80px;
            color: white;
            text-align: center;
         }
         #m:hover{
            background-color: purple;
            transition: 2s;
            transform: scale(1.03);
         }

         #mo{
            background-color: black; height: 80px; width: 80px;
            color: white;
            text-align: center;
         }
         #mo:hover{
            background-color: purple;
            transition: 2s;
            transform: rotate(180deg);
         }
           
    </style>
</head>
<body>
    <div id="h">
        HELLO
    </div><br>

    <div id="he">
        hello
    </div><br>

    <div id="hel">
        hiiiiiiiii
    </div><br>

     <div id="hi">
        hiiiiiiiii
    </div><br><br>

    <div id="m">
        moulya
    </div><br>

    <div id="mo">
        jeev
    </div>

</body>
</html>
