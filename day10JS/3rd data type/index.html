<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //Data Types  - Different Types of Data in

        //1. String - "Text"  or 'Text'

        let email = "abc@gmail.com"  //String

        let password = "12345"   // String
             //InBuild Method - typeof(Value)  Help Us tO check Data Type

        console.log(typeof(email) )

        console.log(typeof(password))

        //2. Number - +ve , -ve , decimal No
        //   Number should be written Directly

        let temp = -22.55

        console.log(typeof(temp))

        //3 . Boolean - true or false

        let LoginStatus = true

        let NetflixSub = false

        console.log(typeof(LoginStatus)) // Boolean

        console.log(typeof(NetflixSub))  // Boolean


        //4. Undefined - When You Don't Assign Any Value

        let discount 
        console.log(typeof(discount))


        //5 . null - Means Nothing

        let Score = null

        console.log(typeof(Score))
        //Due To Bug in Js . It shows Object as Output of null


     // multiple data 

     // 1.array help to store multiple data ->  also store different type of data type 
     //  index no start with zero

     let student = ["jev" , "mou", "kru", 1522, true]
     console.log(student)
     console.log(student[2])
     console.log(student[4])


     // object - collection of data
     // symbol {}
     // key;value - pair

     let employ1={
        name:"moulya",
        email:"moulya22@gmail.com",
        department:"ISE",
        loginSatus: true ,
      }

      console.log(employ1)
      console.log(employ1.name)
      console.log(employ1.loginSatus)


    </script>
</body>
</html>
