<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <label>username</label>
    <input> <br> <br>
    <input placeholder="Enter your name" > <br><br>

    <!--Text input-->
      <input type="text" placeholder="username"> <br>
      <input type="email" placeholder="abc@example.com"> <br>
    
      <input type=" " placeholder="password"><br>
      <input type="password" placeholder="***"><br><br>
     
      <input type="search" placeholder="search.." ><br><br>
      <input type="url" placeholder="https://yoursite.com"><br><br>
      <input type="tel" placeholder="+91 9141126335"><br><br>

    <!---number input-->
      <input type="number" min="18" max="100" step="1"><br><br>
      <input type="range" min="18" max="100" step="1"><br> <br>

   <!--date and time--> 
       <input type="date"><br>
       <input type="time"><br>
       <input type="datetime"> <br>
       <input type="datetime-local"><br>
       <input type="month"><br>
       <input type="week"><br>
       
    <!--selection check-->
       <input type="checkbox">
       <label>I agree </label><br><br>

    <!--special input-->
       <input type="file"> <br> <br> 
       <input type="color"><br><br><br><br>
       

    <!--validation-->
       <input type="text" placeholder="username" required><br>   
       <input type="text" minlength="3" maxlength="10"><br>
       <input type="tel" pattern="[0-9]{10}" placeholder="10 digit" ><br><br>

    <!--reviews-->
    <textarea rows="10" cols="15" placeholder="feedback"></textarea><br><br>


</body>
</html>
