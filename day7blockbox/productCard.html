<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: 0;
        }
        .product{
            border: 1px solid black;
            border-radius: 25px;
            box-sizing: border-box;
            height:100;
            width: 200px;
            padding: 10px;
            text-align: center;
            margin: 10px;

            background-color: burlywood;

            box-shadow: 4px 4px 6px  black;
            /* x-aixs , y-axis , spread radius, colour*/
       }

        div img {
            border-radius: 25px;
            width: 100%;
            height: 150px;
            object-fit: cover;
            border: 1px solid black;
            margin-bottom: 10px;
        }

        div h2{
            font-family: Arial, Helvetica, sans-serif;
            color: brown;
            text-decoration: underline;
            margin-bottom: 10px;
        }

        div p{
            font-size: 20px;
            font-family: 'Times New Roman', Times, serif;
            margin-bottom: 10px;
        }

        .discount{
            color: blue;
            font-size: 20px;
        }

         div button{
            background-color: green;
            border: none;
            padding: 5px;
            border-radius: 20px;
        }

        .logo{
            size: 10px;
        }

        .ecommerce{
            display: flex;
          
            justify-content: center;
            gap:10px;
            align-items: center;
            flex-wrap: wrap;

        }

    </style>
</head>
<body>

    <div class="ecommerce">
    
     <div class="product">
        <img src="https://images.pexels.com/photos/10997623/pexels-photo-10997623.jpeg" alt="Earphones">
        <h2>Earphones</h2>
        <p><del>Rs 2210 </del> <br> <span class="discount">25%</span> <br> Rs 1,200</p>
        <button>Add To Cart</button>
        <button>BUY NOW <span>📩</span> </button>
     </div>

     <div class="product">
        <img src="https://images.pexels.com/photos/1591/technology-music-sound-things.jpg" alt="Headphones" >
        <h2>Headphones</h2>
        <p>Rs 5,000</p>
        <button>BUY NOW <span id="logo">📩</span> </button>
        
     </div>

     <div class="product">
        <img src="https://images.pexels.com/photos/8457654/pexels-photo-8457654.jpeg" alt="Earbuds" >
        <h2>Earbuds</h2>
        <p>Rs 2,000</p>
        <button>BUY NOW</button>

     </div>
    </div>


</body>
</html>
